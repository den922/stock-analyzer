<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式AIアナリスト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f0;
    --surface: #ffffff;
    --surface2: #f7f7f5;
    --border: #e4e2de;
    --border2: #d0cdc8;
    --accent: #4a7c59;
    --accent-light: #eaf1ec;
    --accent-mid: #6a9e78;
    --green: #3d7a52;
    --red: #b94040;
    --amber: #b07d30;
    --text: #1a1a18;
    --text2: #3a3a38;
    --muted: #8a8a85;
    --muted2: #b0b0aa;
    --fund-color: #4a7c59;
    --tech-color: #2e6b5e;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 12px;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .logo-mark {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid rgba(74,124,89,0.2);
    padding: 4px 8px;
    border-radius: 3px;
    letter-spacing: 1.5px;
  }

  .logo h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .search-wrap {
    flex: 1;
    max-width: 400px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 14px 9px 36px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,124,89,0.1);
    background: var(--surface);
  }

  .search-input::placeholder { color: var(--muted2); }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    z-index: 200;
    overflow: hidden;
    display: none;
  }

  .search-results.show { display: block; }

  .search-result-item {
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--surface2); }

  .sri-code {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    min-width: 48px;
  }

  .sri-name { font-size: 13px; color: var(--text2); }

  .market-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .market-tab {
    padding: 10px 20px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    cursor: pointer;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }

  .market-tab:hover { color: var(--text2); }
  .market-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  /* MAIN */
  .main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 80px; }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }

  .trending-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 28px;
    scrollbar-width: none;
  }

  .trending-scroll::-webkit-scrollbar { display: none; }

  .trending-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 158px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }

  .trending-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(74,124,89,0.12);
    transform: translateY(-1px);
  }

  .tc-axis {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    background: var(--accent-light);
    border-radius: 3px;
    padding: 2px 7px;
    display: inline-block;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .tc-code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .tc-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tc-sector {
    font-size: 10px;
    color: var(--muted2);
    background: var(--surface2);
    border-radius: 3px;
    padding: 2px 6px;
    display: inline-block;
    font-family: 'DM Mono', monospace;
  }

  .tc-skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 158px;
    flex-shrink: 0;
  }

  .skel {
    background: linear-gradient(90deg, var(--border) 25%, var(--surface2) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .update-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .update-time {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2.5s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .sort-wrap {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .sort-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-right: 4px;
  }

  .sort-btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 5px 11px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }

  .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sort-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* STOCK GRID */
  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }

  .stock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.18s;
    box-shadow: var(--shadow);
    animation: fadeUp 0.4s ease both;
  }

  .stock-card:hover {
    border-color: var(--accent-mid);
    box-shadow: 0 4px 14px rgba(74,124,89,0.1);
    transform: translateY(-2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 1.5px;
  }

  .badge-buy  { background: rgba(61,122,82,0.12); color: var(--green); border: 1px solid rgba(61,122,82,0.2); }
  .badge-hold { background: rgba(176,125,48,0.12); color: var(--amber); border: 1px solid rgba(176,125,48,0.2); }
  .badge-sell { background: rgba(185,64,64,0.10); color: var(--red);   border: 1px solid rgba(185,64,64,0.18); }

  .card-sector {
    font-size: 10px;
    color: var(--muted2);
    background: var(--surface2);
    border-radius: 3px;
    padding: 3px 8px;
    font-family: 'DM Mono', monospace;
  }

  .card-code {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .card-name {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-reason {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.7;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-scores {
    display: flex;
    gap: 8px;
  }

  .score-pill {
    flex: 1;
    background: var(--surface2);
    border-radius: 6px;
    padding: 7px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sp-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
  }

  .sp-score {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .sp-score.fund { color: var(--fund-color); }
  .sp-score.tech { color: var(--tech-color); }

  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  /* BOTTOM SHEET */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.32);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .sheet-overlay.show { opacity: 1; pointer-events: all; }

  .bottom-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    z-index: 400;
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
    scrollbar-width: none;
  }

  .bottom-sheet::-webkit-scrollbar { display: none; }
  .bottom-sheet.show { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .sheet-inner {
    padding: 16px 24px 48px;
    max-width: 680px;
    margin: 0 auto;
  }

  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .sh-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    padding: 3px 10px;
    border-radius: 3px;
    letter-spacing: 1.5px;
    display: inline-block;
    margin-bottom: 8px;
  }

  .sh-code {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    display: block;
    margin-bottom: 2px;
  }

  .sh-name { font-size: 13px; color: var(--muted); }

  .sh-right { text-align: right; flex-shrink: 0; }

  .sh-price {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }

  .sh-change {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    margin-top: 3px;
  }

  .up   { color: var(--green); }
  .down { color: var(--red); }

  .sh-scores {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .sh-score-card {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
  }

  .ssc-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .ssc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .ssc-dot.fund { background: var(--fund-color); }
  .ssc-dot.tech { background: var(--tech-color); }

  .ssc-score {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }

  .ssc-score.fund  { color: var(--fund-color); }
  .ssc-score.tech  { color: var(--tech-color); }
  .ssc-score.total { color: var(--accent); }
  .ssc-sub { font-size: 10px; color: var(--muted2); }

  .analysis-section { margin-bottom: 20px; }

  .as-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .as-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .as-tag.fund { background: rgba(74,124,89,0.1); color: var(--fund-color); border: 1px solid rgba(74,124,89,0.18); }
  .as-tag.tech { background: rgba(46,107,94,0.1); color: var(--tech-color); border: 1px solid rgba(46,107,94,0.18); }

  .as-summary {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.6;
  }

  .metric-row {
    display: flex;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .metric-row:last-child { border-bottom: none; }

  .metric-name {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    min-width: 155px;
  }

  .metric-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .metric-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  .metric-bar.fund { background: var(--fund-color); }
  .metric-bar.tech { background: var(--tech-color); }

  .metric-val {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    min-width: 80px;
    text-align: right;
  }

  .ai-box {
    background: var(--accent-light);
    border: 1px solid rgba(74,124,89,0.18);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 20px;
  }

  .ai-box-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .ai-box-icon { font-size: 12px; color: var(--accent); }

  .ai-box-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .ai-box-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.9;
  }

  .sheet-close {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    margin-top: 2px;
  }

  .sheet-close:hover { background: var(--border); color: var(--text); }

  /* DISCLAIMER */
  .disclaimer {
    text-align: center;
    padding: 20px 0 0;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted2);
    line-height: 1.9;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  .error-bar {
    background: rgba(185,64,64,0.07);
    border: 1px solid rgba(185,64,64,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
    font-family: 'DM Mono', monospace;
  }

  .error-bar.show { display: block; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted2);
    font-size: 13px;
    display: none;
  }

  .empty-state.show { display: block; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <span class="logo-mark">AI</span>
        <h1>株式AIアナリスト</h1>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="銘柄コード・会社名で検索（例: トヨタ, 7203）">
        <div class="search-results" id="search-results"></div>
      </div>
    </div>
    <div class="market-tabs">
      <button class="market-tab active" data-market="jp">🇯🇵 日本株</button>
      <button class="market-tab" data-market="us">🇺🇸 米国株</button>
      <button class="market-tab" data-market="both">🌍 両方</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="section-label">注目銘柄</div>
  <div class="trending-scroll" id="trending-scroll"></div>

  <div class="update-bar">
    <div class="update-time">
      <span class="live-dot"></span>
      <span id="update-time-text">分析中...</span>
    </div>
    <div class="sort-wrap">
      <span class="sort-label">並び替え</span>
      <button class="sort-btn active" data-sort="total">総合</button>
      <button class="sort-btn" data-sort="fund">ファンダ</button>
      <button class="sort-btn" data-sort="tech">テクニカル</button>
    </div>
  </div>

  <div class="error-bar" id="error-bar"></div>
  <div class="stock-grid" id="stock-grid"></div>
  <div class="empty-state" id="empty-state">銘柄が見つかりませんでした</div>

  <div class="disclaimer">
    ※ 本ツールはAIによる情報提供を目的としており、投資勧誘ではありません。<br>
    投資判断はご自身の責任で行ってください。過去の実績は将来の結果を保証しません。
  </div>
</div>

<!-- BOTTOM SHEET -->
<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-inner" id="sheet-inner"></div>
</div>

<script>
const state = {
  market: 'jp',
  sort: 'total',
  cache: { jp: null, us: null },
  trendingCache: { jp: null, us: null },
  allStocks: [],
};

// Init
document.getElementById('update-time-text').textContent =
  new Date().toLocaleDateString('ja-JP', {month:'long', day:'numeric', weekday:'short'}) + ' 分析開始';

// Market tabs
document.querySelectorAll('.market-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.market = tab.dataset.market;
    loadMarket(state.market);
  });
});

// Sort
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.sort = btn.dataset.sort;
    renderStockGrid(state.allStocks);
  });
});

// Sheet overlay close
document.getElementById('sheet-overlay').addEventListener('click', closeSheet);

// Search
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', handleSearch);
searchInput.addEventListener('blur', () =>
  setTimeout(() => document.getElementById('search-results').classList.remove('show'), 160)
);

function handleSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  const el = document.getElementById('search-results');
  if (!q || state.allStocks.length === 0) { el.classList.remove('show'); return; }

  const matched = state.allStocks.filter(s =>
    s.code.toLowerCase().includes(q) ||
    s.name.toLowerCase().includes(q) ||
    (s.nameEn && s.nameEn.toLowerCase().includes(q))
  ).slice(0, 6);

  if (!matched.length) { el.classList.remove('show'); return; }

  el.innerHTML = matched.map(s => `
    <div class="search-result-item" onmousedown="openSheet(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <span class="sri-code">${s.code}</span>
      <span class="sri-name">${s.name}</span>
    </div>
  `).join('');
  el.classList.add('show');
}

// Load market
async function loadMarket(market) {
  if (market === 'both') { await loadBoth(); return; }
  if (state.cache[market]) {
    state.allStocks = state.cache[market];
    renderStockGrid(state.allStocks);
    renderTrending(market);
    return;
  }
  showSkeletons();
  showTrendingSkeletons();
  await Promise.all([fetchStocks(market), fetchTrending(market)]);
}

async function loadBoth() {
  const needJP = !state.cache.jp;
  const needUS = !state.cache.us;
  if (needJP || needUS) showSkeletons();
  if (needJP) showTrendingSkeletons();
  const tasks = [];
  if (needJP) tasks.push(fetchStocks('jp'), fetchTrending('jp'));
  if (needUS) tasks.push(fetchStocks('us'));
  await Promise.all(tasks);
  state.allStocks = [...(state.cache.jp || []), ...(state.cache.us || [])];
  renderStockGrid(state.allStocks);
  if (state.trendingCache.jp) renderTrending('jp');
}

// Fetch stocks
async function fetchStocks(market) {
  const label = market === 'jp' ? '日本株' : '米国株';
  const currency = market === 'jp' ? '日本円（¥）' : 'ドル（$）';
  const hint = market === 'jp'
    ? 'トヨタ・ソニー・キーエンス等の大型株に加え、メルカリ・レーザーテック・ペプチドリーム・サンバイオ等の新興・先端技術株も積極的に含めること'
    : 'NVIDIA・Apple・Microsoft等の大型株に加え、Palantir・Rivian・CRISPR Therapeutics等の新興株も含めること';

  const prompt = `あなたは優秀な株式アナリストです。${label}の中から本日おすすめの銘柄を20個選定してください。
選定は「モメンタム」「グロース」「テーマ株（AI・宇宙・バイオ・再エネ等）」「隠れ割安」の4軸で行い、${hint}。価格は${currency}で記載。

必ずJSON形式のみで返答してください。前置き・説明文・マークダウンのコードブロック（\`\`\`）は一切不要です。
最初の文字は { で始め、最後の文字は } で終わること。

形式:
{"stocks":[{"code":"7203","name":"トヨタ自動車","nameEn":"Toyota Motor","price":"¥3,450","change":"+1.2%","changePositive":true,"recommendation":"BUY","sector":"自動車","axis":"モメンタム","reason":"直近決算で過去最高益を更新。EV事業の本格化で中長期成長期待が高まっている。","fundScore":78,"techScore":72,"totalScore":75,"fundamental":{"score":78,"summary":"PERは業界平均を下回り割安感あり。ROEは改善傾向。","metrics":[{"name":"PER","value":"10.2倍","score":80,"sentiment":"positive"},{"name":"PBR","value":"1.2倍","score":75,"sentiment":"positive"},{"name":"ROE","value":"14.3%","score":78,"sentiment":"positive"},{"name":"営業利益率","value":"9.8%","score":72,"sentiment":"positive"},{"name":"配当利回り","value":"2.8%","score":70,"sentiment":"neutral"},{"name":"売上成長率","value":"+7.2%","score":68,"sentiment":"neutral"}]},"technical":{"score":72,"summary":"25日線上抜け。RSIは適度な水準。","metrics":[{"name":"RSI（14日）","value":"58.3","score":65,"sentiment":"neutral"},{"name":"MACD","value":"上昇クロス","score":78,"sentiment":"positive"},{"name":"移動平均線","value":"上抜け","score":80,"sentiment":"positive"},{"name":"出来高","value":"増加傾向","score":72,"sentiment":"positive"},{"name":"ボリンジャーバンド","value":"中心帯","score":60,"sentiment":"neutral"},{"name":"サポートライン","value":"強固","score":75,"sentiment":"positive"}]},"aiComment":"ファンダ・テクニカル双方で強いシグナル。買いエントリーが有効。"}]}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 7000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    // テキストブロックを結合
    const text = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

    // マークダウンのコードブロックを除去してからJSON抽出
    const cleaned = text
      .replace(/```json\s*/gi, '')
      .replace(/```\s*/gi, '')
      .trim();

    // { ... } の最外郭を抽出
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('レスポンスにJSONが含まれていません');

    const jsonStr = cleaned.slice(start, end + 1);
    const parsed = JSON.parse(jsonStr);

    if (!parsed.stocks || !Array.isArray(parsed.stocks)) {
      throw new Error('stocks データが見つかりません');
    }

    state.cache[market] = parsed.stocks;
    if (state.market === market || state.market === 'both') {
      state.allStocks = state.market === 'both'
        ? [...(state.cache.jp || []), ...(state.cache.us || [])]
        : parsed.stocks;
      renderStockGrid(state.allStocks);
      document.getElementById('update-time-text').textContent =
        new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) + ' 更新';
    }
  } catch(e) {
    showError('⚠ ' + e.message);
    document.getElementById('stock-grid').innerHTML = '';
  }
}

// Fetch trending
async function fetchTrending(market) {
  const label = market === 'jp' ? '日本株' : '米国株';
  const prompt = `${label}の中から今日注目すべき銘柄を8個選んでください。モメンタム・グロース・テーマ株・隠れ割安の4軸から2個ずつ選定し、大型株だけでなく新興・先端技術株も含めてください。JSONのみ返答（前置き不要）:{"trending":[{"code":"7203","name":"トヨタ自動車","sector":"自動車","axis":"モメンタム"}]}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 600,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    if (data.error) return;
    const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) return;
    const parsed = JSON.parse(match[0]);
    state.trendingCache[market] = parsed.trending;
    if (state.market === market || (state.market === 'both' && market === 'jp')) {
      renderTrending(market);
    }
  } catch(e) {}
}

// Render trending
function renderTrending(market) {
  const data = state.trendingCache[market];
  if (!data) return;
  document.getElementById('trending-scroll').innerHTML = data.map(t => `
    <div class="trending-card" onclick="openFromTrending('${t.code}')">
      <span class="tc-axis">${t.axis}</span>
      <div class="tc-code">${t.code}</div>
      <div class="tc-name">${t.name}</div>
      <span class="tc-sector">${t.sector}</span>
    </div>
  `).join('');
}

function showTrendingSkeletons() {
  document.getElementById('trending-scroll').innerHTML = Array(6).fill(`
    <div class="tc-skeleton">
      <div class="skel" style="width:58px;height:17px;margin-bottom:8px;border-radius:3px;"></div>
      <div class="skel" style="width:75px;height:14px;margin-bottom:6px;"></div>
      <div class="skel" style="width:110px;height:12px;margin-bottom:8px;"></div>
      <div class="skel" style="width:48px;height:16px;border-radius:3px;"></div>
    </div>
  `).join('');
}

// Render grid
function renderStockGrid(stocks) {
  const grid = document.getElementById('stock-grid');
  const empty = document.getElementById('empty-state');
  if (!stocks || !stocks.length) { grid.innerHTML = ''; empty.classList.add('show'); return; }
  empty.classList.remove('show');

  const sorted = [...stocks].sort((a, b) => {
    if (state.sort === 'fund') return b.fundScore - a.fundScore;
    if (state.sort === 'tech') return b.techScore - a.techScore;
    return b.totalScore - a.totalScore;
  });

  grid.innerHTML = sorted.map((s, i) => `
    <div class="stock-card" style="animation-delay:${i * 0.025}s" onmousedown='openSheet(${JSON.stringify(s).replace(/'/g,"&#39;")})'>
      <div class="card-top">
        <span class="card-badge badge-${(s.recommendation||'hold').toLowerCase()}">${s.recommendation}</span>
        <span class="card-sector">${s.sector}</span>
      </div>
      <div class="card-code">${s.code}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-reason">${s.reason}</div>
      <div class="card-scores">
        <div class="score-pill">
          <span class="sp-label">ファンダ</span>
          <span class="sp-score fund">${s.fundScore}</span>
        </div>
        <div class="score-pill">
          <span class="sp-label">テクニカル</span>
          <span class="sp-score tech">${s.techScore}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function showSkeletons() {
  document.getElementById('stock-grid').innerHTML = Array(12).fill(`
    <div class="skeleton-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <div class="skel" style="width:48px;height:20px;border-radius:3px;"></div>
        <div class="skel" style="width:58px;height:20px;border-radius:3px;"></div>
      </div>
      <div class="skel" style="width:85px;height:19px;margin-bottom:6px;"></div>
      <div class="skel" style="width:128px;height:13px;margin-bottom:12px;"></div>
      <div class="skel" style="width:100%;height:12px;margin-bottom:5px;"></div>
      <div class="skel" style="width:78%;height:12px;margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;">
        <div class="skel" style="flex:1;height:40px;border-radius:6px;"></div>
        <div class="skel" style="flex:1;height:40px;border-radius:6px;"></div>
      </div>
    </div>
  `).join('');
}

// Bottom sheet
function openSheet(stock) {
  if (typeof stock === 'string') stock = JSON.parse(stock);
  const sentColor = s => s === 'positive' ? 'var(--green)' : s === 'negative' ? 'var(--red)' : 'var(--text2)';
  const badgeClass = `badge-${(stock.recommendation||'hold').toLowerCase()}`;
  const changeClass = stock.changePositive ? 'up' : 'down';
  const fm = stock.fundamental?.metrics || [];
  const tm = stock.technical?.metrics || [];

  document.getElementById('sheet-inner').innerHTML = `
    <div class="sheet-header">
      <div>
        <span class="sh-badge ${badgeClass}">${stock.recommendation}</span>
        <span class="sh-code">${stock.code} <span style="font-size:13px;color:var(--muted);font-weight:400;">${stock.sector}</span></span>
        <div class="sh-name">${stock.name}</div>
      </div>
      <div class="sh-right">
        <div class="sh-price">${stock.price || '---'}</div>
        <div class="sh-change ${changeClass}">${stock.change || '---'}</div>
      </div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>

    <div class="sh-scores">
      <div class="sh-score-card">
        <div class="ssc-label"><span class="ssc-dot fund"></span>ファンダメンタル</div>
        <div class="ssc-score fund">${stock.fundScore}</div>
        <div class="ssc-sub">/ 100点</div>
      </div>
      <div class="sh-score-card">
        <div class="ssc-label"><span class="ssc-dot tech"></span>テクニカル</div>
        <div class="ssc-score tech">${stock.techScore}</div>
        <div class="ssc-sub">/ 100点</div>
      </div>
      <div class="sh-score-card">
        <div class="ssc-label">総合スコア</div>
        <div class="ssc-score total">${stock.totalScore}</div>
        <div class="ssc-sub">/ 100点</div>
      </div>
    </div>

    <div class="analysis-section">
      <div class="as-header">
        <span class="as-tag fund">① FUNDAMENTAL</span>
        <span class="as-summary">${stock.fundamental?.summary || ''}</span>
      </div>
      ${fm.map(m => `
        <div class="metric-row">
          <span class="metric-name">${m.name}</span>
          <div class="metric-bar-wrap"><div class="metric-bar fund" style="width:${m.score}%"></div></div>
          <span class="metric-val" style="color:${sentColor(m.sentiment)}">${m.value}</span>
        </div>
      `).join('')}
    </div>

    <div class="analysis-section">
      <div class="as-header">
        <span class="as-tag tech">② TECHNICAL</span>
        <span class="as-summary">${stock.technical?.summary || ''}</span>
      </div>
      ${tm.map(m => `
        <div class="metric-row">
          <span class="metric-name">${m.name}</span>
          <div class="metric-bar-wrap"><div class="metric-bar tech" style="width:${m.score}%"></div></div>
          <span class="metric-val" style="color:${sentColor(m.sentiment)}">${m.value}</span>
        </div>
      `).join('')}
    </div>

    <div class="ai-box">
      <div class="ai-box-header">
        <span class="ai-box-icon">✦</span>
        <span class="ai-box-title">AI 総合見解</span>
      </div>
      <div class="ai-box-text">${stock.aiComment || ''}</div>
    </div>
  `;

  document.getElementById('sheet-overlay').classList.add('show');
  requestAnimationFrame(() => document.getElementById('bottom-sheet').classList.add('show'));
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('bottom-sheet').classList.remove('show');
  document.getElementById('sheet-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

function openFromTrending(code) {
  const found = state.allStocks.find(s => s.code === code);
  if (found) openSheet(found);
}

function showError(msg) {
  const el = document.getElementById('error-bar');
  el.textContent = msg;
  el.classList.add('show');
}

// Start
loadMarket('jp');
</script>
</body>
</html>
